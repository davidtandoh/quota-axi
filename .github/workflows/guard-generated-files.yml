name: Guard generated files

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    # Never create a run for a release-please PR. The job-level author exemption
    # below cannot do this: it is evaluated inside a run, and a GITHUB_TOKEN PR's
    # run is created in action_required and never starts.
    paths-ignore:
      - .release-please-manifest.json
      - CHANGELOG.md
      - package.json

permissions:
  contents: read

concurrency:
  group: guard-generated-files-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Generated files must not be hand-edited
    runs-on: ubuntu-latest
    # release-please owns CHANGELOG.md and .release-please-manifest.json; its PR
    # is the one legitimate place those files change, so we exempt its author.
    if: >-
      github.event.pull_request.user.login != 'github-actions[bot]' &&
      github.event.pull_request.user.login != 'release-please[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          # Need history on both sides of the merge-base so `git diff base...head`
          # reflects exactly what GitHub shows as "Files changed".
          fetch-depth: 0

      # This fork merges upstream main, which carries upstream's own
      # release-please output. Fetch it from the fixed upstream URL so the check
      # below can prove such bytes came from upstream instead of a hand edit.
      - name: Fetch trusted upstream main
        run: git fetch --no-tags https://github.com/kunchenguid/quota-axi.git +refs/heads/main:refs/remotes/upstream/main

      - name: Check PR does not modify release-please-generated files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          files=$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")

          # An upstream sync may carry generated files only byte-for-byte as the
          # upstream commit pinned in fork-sync.json, and only when that commit is
          # both in this PR's history and on trusted upstream main, and strictly
          # advances the base branch's pin so stale upstream output is rejected.
          pin=$(git show "${HEAD_SHA}:fork-sync.json" 2>/dev/null | jq -r '.upstream.commit // empty' 2>/dev/null || true)
          base_pin=$(git show "${BASE_SHA}:fork-sync.json" 2>/dev/null | jq -r '.upstream.commit // empty' 2>/dev/null || true)
          if ! printf '%s' "$pin" | grep -qxE '[0-9a-f]{40}' ||
            [ "$pin" = "$base_pin" ] ||
            ! git merge-base --is-ancestor "$base_pin" "$pin" 2>/dev/null ||
            ! git merge-base --is-ancestor "$pin" "$HEAD_SHA" 2>/dev/null ||
            ! git merge-base --is-ancestor "$pin" refs/remotes/upstream/main 2>/dev/null; then
            pin=""
          fi

          violated=""
          for path in CHANGELOG.md .release-please-manifest.json; do
            if printf '%s\n' "$files" | grep -qxF -- "$path"; then
              # Only a violation if the file already existed on the base branch.
              # A PR that creates it for the first time (e.g. wiring up
              # release-please) is not hand-editing bot-owned content.
              if git cat-file -e "${BASE_SHA}:${path}" 2>/dev/null; then
                # A missing file never matches, so a sync cannot delete it.
                head_entry=$(git ls-tree "$HEAD_SHA" -- "$path")
                if [ -n "$pin" ] && [ -n "$head_entry" ] &&
                  [ "$head_entry" = "$(git ls-tree "$pin" -- "$path")" ]; then
                  echo "${path} matches pinned upstream ${pin}. OK."
                  continue
                fi
                violated="${violated} ${path}"
              fi
            fi
          done

          if [ -n "$violated" ]; then
            {
              echo "::error::This PR modifies release-please-generated files:${violated}"
              echo
              echo "CHANGELOG.md and .release-please-manifest.json are auto-generated by"
              echo "release-please from conventional commits on main. Do not hand-edit them."
              echo
              echo "If you want your change to appear in the next release notes, use a"
              echo "conventional commit message (feat/fix/docs/...). release-please will"
              echo "update these files in the next release PR automatically."
              echo
              echo "See CONTRIBUTING.md for the full contributor workflow."
            } >&2
            exit 1
          fi

          echo "No release-please-generated files modified. OK."
